<svg viewBox="0 0 487 282" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: two navigation levels. Global destinations stay on the rail, application modules only inside an application"><style>:root{--bg-mat:#EEF0F2;--border-default:#C9CFD6;--fg-muted:#5B6470;--apparatus-default:#1F5FA8;--action-default:#8C2F39;}@media (prefers-color-scheme: dark){:root{--bg-mat:#151A21;--border-default:#39414C;--fg-muted:#98A2B0;--apparatus-default:#7FB2E5;--action-default:#C97B83;}}</style><rect width="487" height="282" fill="var(--bg-mat)"/><text x="36" y="50" font-family="IBM Plex Mono,monospace" font-size="9" letter-spacing="1.7" fill="var(--apparatus-default)">TWO LEVELS, ONE RAIL</text><rect x="36" y="70" width="104" height="1" fill="var(--fg-muted)"/><rect x="196" y="70" width="236" height="1" fill="var(--action-default)"/><rect x="36" y="86" width="104" height="14" rx="3" fill="var(--border-default)"/><rect x="36" y="112" width="104" height="14" rx="3" fill="var(--border-default)"/><rect x="36" y="138" width="104" height="14" rx="3" fill="var(--border-default)"/><rect x="36" y="164" width="104" height="14" rx="3" fill="var(--border-default)"/><rect x="36" y="190" width="104" height="14" rx="3" fill="var(--border-default)"/><rect x="196" y="86" width="236" height="14" rx="3" fill="var(--apparatus-default)" opacity="0.55"/><rect x="196" y="112" width="218" height="14" rx="3" fill="var(--apparatus-default)" opacity="0.48"/><rect x="196" y="138" width="200" height="14" rx="3" fill="var(--apparatus-default)" opacity="0.41"/><rect x="196" y="164" width="182" height="14" rx="3" fill="var(--apparatus-default)" opacity="0.34"/><rect x="196" y="190" width="164" height="14" rx="3" fill="var(--apparatus-default)" opacity="0.27"/><text x="36" y="236" font-family="IBM Plex Mono,monospace" font-size="8" letter-spacing="1.1" fill="var(--fg-muted)">LEVEL 1 · GLOBAL</text><text x="196" y="236" font-family="IBM Plex Mono,monospace" font-size="8" letter-spacing="1.1" fill="var