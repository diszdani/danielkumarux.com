)" stroke-width="1.6"/><circle cx="339" cy="174" r="2.6" fill="var(--act)"/><rect x="352" y="168" width="46" height="31" fill="var(--face)" stroke="var(--rule)" stroke-width="1"/><rect x="406" y="168" width="46" height="31" fill="var(--face)" stroke="var(--rule)" stroke-width="1"/></svg>