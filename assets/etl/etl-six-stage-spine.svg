<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 487 282" role="img" aria-label="Diagram: the six-stage spine every source family travels: source profile, workspace, metadata entity, extraction entity, execution, monitoring"><style>:root{--ink:#14181F;--muted:#5B6470;--rule:#DCE0E4;--app:#1F3A5F;--act:#8C2F39;--face:#F5F6F7;}@media (prefers-color-scheme:dark){:root{--ink:#E9ECEF;--muted:#8B95A2;--rule:#2A3038;--app:#8FA8C4;--act:#D4737C;--face:#14181F;}}.t{font-family:"IBM Plex Mono",ui-monospace,monospace;}</style><text class="t" x="36" y="50" font-size="9" letter-spacing="1.7" fill="var(--app)">THE SPINE EVERY SOURCE FAMILY TRAVELS</text><line x1="56" y1="131" x2="431" y2="131" stroke="var(--rule)" stroke-width="1"/><rect x="43" y="118" width="26" height="26" fill="var(--face)" stroke="var(--ink)" stroke-width="1"/><text class="t" x="56" y="135" text-anchor="middle" font-size="9" fill="var(--ink)">01</text><text class="t" x="56" y="162" text-anchor="middle" font-size="8" letter-spacing="0.6" fill="var(--muted)">SOURCE</text><rect x="118" y="118" width="26" height="26" fill="var(--face)" stroke="var(--ink)" stroke-width="1"/><text class="t" x="131" y="135" text-anchor="middle" font-size="9" fill="var(--ink)">02</text><text class="t" x="131" y="162" text-anchor="middle" font-size="8" letter-spacing="0.6" fill="var(--muted)">WORKSPACE</text><rect x="193" y="118" width="26" height="26" fill="var(--face)" stroke="var(--ink)" stroke-width="1"/><text class="t" x="206" y="135" text-anchor="middle" font-size="9" fill="var(--ink)">03</text><text class="t" x="206" y="162" text-anchor="middle" font-size="8" letter-spacing="0.6" fill="var(--muted)">METADATA</text><rect x="268" y="118" width="26" height="26" fill="var(--face)" stroke="var(--ink)" stroke-width="1"/><text class="t" x="281" y="135" text-anchor="middle" font-size="9" fill="var(--ink)">04</text><text class="t" x="281" y="162" text-anchor="middle" font-size="8" letter-spacing="0.6" fill="var(--muted)">EXTRACT</text><rect x="343" y="118" width="26" height="26" fill="var(--face)" stroke="var(--ink)" stroke-width="1"/><text class="t" x="356" y="135" text-anchor="middle" font-size="9" fill="var(--ink)">05</text><text class="t" x="356" y="162" text-anchor="middle" font-size="8" letter-spacing="0.6" fill="var(--muted)">EXECUTE</text><rect x="418" y="118" width="26" height="26" fill="var(--face)" stroke="var(--ink)" stroke-width="1"/><text class="t" x="431" y="135" text-anchor="middle" font-size="9" fill="var(--ink)">06</text><text class="t" x="431" y="162" text-anchor="middle" font-size="8" letter-spacing="0.6" fill="var(--muted)">MONITOR</text><line x1="36" y1="212" x2="451" y2="212" stroke="var(--rule)" stroke-width="1"/><text class="t" x="36" y="235" font-size="9" letter-spacing="1.5" fill="var(--muted)">9 SOURCE FAMILIES  ·  13 DATABASE TYPES  ·  1 WIZARD</text></svg>